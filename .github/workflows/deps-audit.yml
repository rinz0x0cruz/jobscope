name: dependency audit

on:
  schedule:
    - cron: "37 5 * * 2"
  workflow_dispatch:

concurrency:
  group: dependency-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      # Dependabot parses requirements.txt and pyproject.toml, so it only sees the
      # direct pins; the transitive ones live in requirements.lock. Auditing the
      # installed environment covers both without re-resolving.
      - name: Audit the installed environment
        run: pip-audit --strict --progress-spinner off
