name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Set up Node for crypto compatibility tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install locked Python dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Lint (ruff)
        run: ruff check .
      - name: Offline selftest
        run: python -m jobscope selftest
      - name: Unit tests
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: UX tests (Vitest)
        run: npm test
      - name: Build locked dashboard shell
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/dashboard.public.json"
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({generated:"ci",total:0,rows:[],overview:{funnel:{},gaps:[],considered:0,targets:[]},applications:[],profile:null,applied_outreach:[],outreach_snapshot:{read_only:true,campaigns:[],details:[],engagements:[]}}))' "$fixture"
          JOBSCOPE_DASHBOARD_JSON="$fixture" \
          JOBSCOPE_ENCRYPTED_JSON=none \
          npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Build hosted image once
        run: docker build --tag "jobscope-hosted:${GITHUB_SHA}" .
      - name: Smoke hosted image and persistent volume
        env:
          IMAGE: jobscope-hosted:${{ github.sha }}
          PUBLIC_ORIGIN: https://jobs.example.test
          AUTOMATION_TOKEN: ci-automation-token-32-characters-minimum
          ACCESS_TEAM_DOMAIN: https://ci.cloudflareaccess.com
          ACCESS_AUDIENCE: ci-audience
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/jobscope-data"
          mkdir -p "$data"
          cat > "$data/config.yaml" <<'YAML'
          output:
            db_path: /data/jobscope.db
          serve:
            refresh_enabled: false
            build_on_start: false
          ai:
            enabled: false
          email:
            enabled: false
          YAML

          cleanup() {
            docker rm --force jobscope-hosted >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          start() {
            docker run --detach --name jobscope-hosted \
              --publish 127.0.0.1:8799:8799 \
              --env "JOBSCOPE_PUBLIC_ORIGIN=$PUBLIC_ORIGIN" \
              --env "JOBSCOPE_AUTOMATION_TOKEN=$AUTOMATION_TOKEN" \
              --env "JOBSCOPE_CF_ACCESS_TEAM_DOMAIN=$ACCESS_TEAM_DOMAIN" \
              --env "JOBSCOPE_CF_ACCESS_AUD=$ACCESS_AUDIENCE" \
              --volume "$data:/data" \
              "$IMAGE" >/dev/null
            for attempt in {1..30}; do
              if curl --fail --silent http://127.0.0.1:8799/healthz >/dev/null; then
                return 0
              fi
              sleep 1
            done
            docker logs jobscope-hosted
            return 1
          }

          start
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8799/api/token)" = "403"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Cf-Access-Jwt-Assertion: validated-ci-access-jwt" \
            http://127.0.0.1:8799/api/token)" = "403"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --dump-header "$RUNNER_TEMP/hosted-headers" \
            --header "Cf-Access-Jwt-Assertion: validated-ci-access-jwt" \
            --header "X-Jobscope-Automation: $AUTOMATION_TOKEN" \
            --header "Origin: $PUBLIC_ORIGIN" \
            http://127.0.0.1:8799/api/automation/status)" = "403"
          grep --ignore-case --quiet '^x-frame-options: DENY' "$RUNNER_TEMP/hosted-headers"
          docker exec jobscope-hosted cat /app/web/dist/sw.js > "$RUNNER_TEMP/hosted-sw.js"
          grep --quiet 'registration.unregister' "$RUNNER_TEMP/hosted-sw.js"
          ! grep --quiet 'precacheAndRoute' "$RUNNER_TEMP/hosted-sw.js"

          cleanup
          start
          test -s "$data/jobscope.db"
          docker exec --interactive jobscope-hosted python - <<'PY'
          import sqlite3

          with sqlite3.connect("/data/jobscope.db") as connection:
              assert connection.execute("PRAGMA quick_check").fetchone()[0] == "ok"
              assert connection.execute("PRAGMA journal_mode").fetchone()[0] == "wal"
          PY
      - name: Publish the tested image by commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          tested="jobscope-hosted:${GITHUB_SHA}"
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$tested" "$repository:$GITHUB_SHA"
          output="$(docker push "$repository:$GITHUB_SHA" 2>&1)"
          printf '%s\n' "$output"
          digest="$(printf '%s\n' "$output" | awk '/digest:/ { print $2 }' | tail -n 1)"
          test -n "$digest"
          printf 'Tested hosted image: `%s@%s`\n' "$repository" "$digest" >> "$GITHUB_STEP_SUMMARY"

  publish-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements.lock
          cd web
          npm ci
      - name: Build and verify isolated encrypted artifact
        run: |
          export JOBSCOPE_APPS_PASSPHRASE="ci-artifact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash scripts/publish.sh --encrypted --verify-only --force

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install detect-secrets
        run: python -m pip install detect-secrets==1.5.0
      - name: Scan tracked files for committed secrets
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: House-style compliance (vendored house_check.py)
        run: python .github/house_check.py --strict .
