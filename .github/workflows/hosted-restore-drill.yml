name: hosted-restore-drill
run-name: Restore ${{ inputs.backup_artifact_name }}

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Published GHCR digest (sha256:...)"
        required: true
        type: string
      backup_run_id:
        description: "Successful hosted-backup workflow run ID"
        required: true
        type: string
      backup_artifact_name:
        description: "Immutable backup artifact name"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: jobscope-hosted-restore-drill
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JOBSCOPE_BACKUP_KEY: ${{ secrets['JOBSCOPE_BACKUP_KEY'] }}
      DIGEST: ${{ inputs.image_digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.backup_artifact_name }}
          path: ${{ runner.temp }}/generation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.backup_run_id }}

      - name: Pull selected immutable image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::invalid image digest"; exit 1; }
          [ "${#JOBSCOPE_BACKUP_KEY}" -ge 12 ] || { echo "::error::JOBSCOPE_BACKUP_KEY is not configured"; exit 1; }
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$repository@$DIGEST"
          echo "IMAGE=$repository@$DIGEST" >> "$GITHUB_ENV"

      - name: Restore and inspect with the pulled image
        run: |
          set -euo pipefail
          started="$(date +%s)"
          restore="$RUNNER_TEMP/restore"
          mkdir -p "$restore"
          cat > "$restore/config.yaml" <<'YAML'
          output:
            db_path: /data/jobscope.db
          serve:
            refresh_enabled: false
            build_on_start: false
          ai:
            enabled: false
          email:
            enabled: false
          inbox:
            enabled: false
          YAML
          docker run --rm \
            --env JOBSCOPE_BACKUP_KEY \
            --volume "$RUNNER_TEMP/generation:/backup:ro" \
            --volume "$restore:/data" \
            "$IMAGE" python -m jobscope.core.backup restore /backup /data/jobscope.db
          docker run --rm --volume "$restore:/data" \
            "$IMAGE" python -m jobscope --config /data/config.yaml doctor
          echo "RESTORE_STARTED=$started" >> "$GITHUB_ENV"
          echo "RESTORE_DIR=$restore" >> "$GITHUB_ENV"

      - name: Start isolated read-only recovery service
        env:
          PUBLIC_ORIGIN: https://recovery.example.test
          AUTOMATION_ORIGIN: https://recovery-automation.example.test
          AUTOMATION_TOKEN: recovery-automation-token-32-characters
          EDGE_TOKEN: recovery-edge-token-32-characters-minimum
          ACCESS_TEAM_DOMAIN: https://recovery.cloudflareaccess.com
          ACCESS_AUDIENCE: recovery-audience
          APPS_PASSPHRASE: recovery-read-passphrase
        run: |
          set -euo pipefail
          cleanup() { docker rm --force jobscope-recovery >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          start() {
            docker run --detach --name jobscope-recovery \
              --publish 127.0.0.1:8799:8799 \
              --env JOBSCOPE_RECOVERY_MODE=1 \
              --env "JOBSCOPE_PUBLIC_ORIGIN=$PUBLIC_ORIGIN" \
              --env "JOBSCOPE_AUTOMATION_ORIGIN=$AUTOMATION_ORIGIN" \
              --env "JOBSCOPE_AUTOMATION_TOKEN=$AUTOMATION_TOKEN" \
              --env "JOBSCOPE_AUTOMATION_EDGE_TOKEN=$EDGE_TOKEN" \
              --env "JOBSCOPE_CF_ACCESS_TEAM_DOMAIN=$ACCESS_TEAM_DOMAIN" \
              --env "JOBSCOPE_CF_ACCESS_AUD=$ACCESS_AUDIENCE" \
              --env "JOBSCOPE_APPS_PASSPHRASE=$APPS_PASSPHRASE" \
              --volume "$RESTORE_DIR:/data" \
              "$IMAGE" >/dev/null
            for attempt in {1..30}; do
              curl --fail --silent http://127.0.0.1:8799/healthz >/dev/null && return 0
              sleep 1
            done
            docker logs jobscope-recovery
            return 1
          }
          read_smoke() {
            curl --silent --show-error --fail \
              --header "X-Jobscope-Automation: $AUTOMATION_TOKEN" \
              --header "X-Jobscope-Edge: $EDGE_TOKEN" \
              --header "Origin: $AUTOMATION_ORIGIN" \
              http://127.0.0.1:8799/api/automation/snapshot \
              | python -c 'import json,sys; value=json.load(sys.stdin); assert value.get("ok") and isinstance(value.get("encrypted"), dict)'
          }
          outbound_smoke() {
            code="$(curl --silent --output "$RUNNER_TEMP/recovery-tick.json" --write-out '%{http_code}' \
              --request POST --header 'Content-Type: application/json' --data '{}' \
              --header "X-Jobscope-Automation: $AUTOMATION_TOKEN" \
              --header "X-Jobscope-Edge: $EDGE_TOKEN" \
              --header "Origin: $AUTOMATION_ORIGIN" \
              http://127.0.0.1:8799/api/automation/tick)"
            test "$code" = "503"
            python -c 'import json,sys; value=json.load(open(sys.argv[1])); assert value.get("code") == "recovery_mode" and value.get("sent") is False' "$RUNNER_TEMP/recovery-tick.json"
          }
          start
          read_smoke
          outbound_smoke
          docker restart jobscope-recovery >/dev/null
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8799/healthz >/dev/null && break
            sleep 1
          done
          read_smoke
          outbound_smoke

          python - "$RUNNER_TEMP/generation/manifest.json" "$RESTORE_STARTED" "$DIGEST" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import datetime as dt, json, sys, time
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          created = dt.datetime.fromisoformat(manifest["created_at"].replace("Z", "+00:00"))
          age = max(0, int((dt.datetime.now(dt.timezone.utc) - created).total_seconds()))
          elapsed = max(0, int(time.time()) - int(sys.argv[2]))
          print(f"Restored backup: `{manifest['backup_id']}`")
          print(f"\nPulled image: `{sys.argv[3]}`")
          print(f"\nRestored-data age: `{age}` seconds")
          print(f"\nMeasured recovery time: `{elapsed}` seconds")
          print("\nDoctor, restart, encrypted read API, and outbound-disable checks passed.")
          PY