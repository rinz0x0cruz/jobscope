name: hosted-backup
run-name: Create encrypted full backup

on:
  workflow_dispatch:

concurrency:
  group: jobscope-hosted-operations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOBSCOPE_AUTOMATION_ORIGIN: ${{ vars['JOBSCOPE_AUTOMATION_ORIGIN'] }}
      JOBSCOPE_AUTOMATION_TOKEN: ${{ secrets['JOBSCOPE_AUTOMATION_TOKEN'] }}
      JOBSCOPE_BACKUP_KEY: ${{ secrets['JOBSCOPE_BACKUP_KEY'] }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Guard required configuration
        run: |
          set -euo pipefail
          [ -n "$JOBSCOPE_AUTOMATION_ORIGIN" ] || { echo "::error::JOBSCOPE_AUTOMATION_ORIGIN is not configured"; exit 1; }
          [ -n "$JOBSCOPE_AUTOMATION_TOKEN" ] || { echo "::error::JOBSCOPE_AUTOMATION_TOKEN is not configured"; exit 1; }
          [ "${#JOBSCOPE_BACKUP_KEY}" -ge 12 ] || { echo "::error::JOBSCOPE_BACKUP_KEY is not configured"; exit 1; }
          case "$JOBSCOPE_AUTOMATION_ORIGIN" in https://*) ;; *) echo "::error::automation origin must use HTTPS"; exit 1;; esac

      - name: Install locked verifier
        run: python -m pip install --requirement requirements.lock

      - name: Fetch and independently verify encrypted generation
        run: |
          set -euo pipefail
          origin="${JOBSCOPE_AUTOMATION_ORIGIN%/}"
          archive="$RUNNER_TEMP/jobscope-full-backup.zip"
          generation="$RUNNER_TEMP/generation"
          mkdir -p "$generation"
          curl --silent --show-error --fail \
            --connect-timeout 10 --max-time 600 \
            --header "X-Jobscope-Automation: $JOBSCOPE_AUTOMATION_TOKEN" \
            --header "Origin: $origin" \
            "$origin/api/automation/backup" > "$archive"
          python - "$archive" "$generation" <<'PY'
          import sys, zipfile
          archive, generation = sys.argv[1:]
          with zipfile.ZipFile(archive) as bundle:
              expected = {"jobscope.db.jsdb", "manifest.json"}
              if set(bundle.namelist()) != expected:
                  raise SystemExit("backup archive members are invalid")
              bundle.extractall(generation)
          PY
          python -m jobscope.core.backup verify "$generation"
          python - "$generation/manifest.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          database = value["database"]
          print(f"Backup `{value['backup_id']}` verified")
          print(f"\nArtifact: `{value['artifact_identity']}`")
          print(f"\nCreated: `{value['created_at']}`")
          print(f"\nTables: `{database['table_count']}`; bytes: `{database['bytes']}`")
          print(f"\nEncrypted SHA-256: `{value['encrypted']['sha256']}`")
          PY
          python - "$generation/manifest.json" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"JOBSCOPE_BACKUP_ID={value['backup_id']}")
          print(f"JOBSCOPE_BACKUP_SHA256={value['encrypted']['sha256']}")
          PY
          rm -f "$archive"

      - name: Retain immutable off-provider generation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jobscope-full-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/generation/jobscope.db.jsdb
            ${{ runner.temp }}/generation/manifest.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Acknowledge retained generation
        run: |
          set -euo pipefail
          origin="${JOBSCOPE_AUTOMATION_ORIGIN%/}"
          python - > "$RUNNER_TEMP/backup-ack.json" <<'PY'
          import json, os
          print(json.dumps({
              "backup_id": os.environ["JOBSCOPE_BACKUP_ID"],
              "encrypted_sha256": os.environ["JOBSCOPE_BACKUP_SHA256"],
          }, separators=(",", ":")))
          PY
          curl --silent --show-error --fail \
            --connect-timeout 10 --max-time 60 \
            --request POST --header "Content-Type: application/json" \
            --header "X-Jobscope-Automation: $JOBSCOPE_AUTOMATION_TOKEN" \
            --header "Origin: $origin" \
            --data-binary "@$RUNNER_TEMP/backup-ack.json" \
            "$origin/api/automation/backup/ack" \
            | python -c 'import json,os,sys; value=json.load(sys.stdin); assert value.get("ok") and value.get("backup_id") == os.environ["JOBSCOPE_BACKUP_ID"]'