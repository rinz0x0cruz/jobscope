name: hosted-ops
run-name: Hosted ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Private control-plane operation"
        type: choice
        options: [refresh, tick]
        default: refresh
      force:
        description: "Repeat today's refresh"
        type: boolean
        default: false
      full_scan:
        description: "Also scan job boards"
        type: boolean
        default: false

concurrency:
  group: jobscope-hosted-operations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JOBSCOPE_AUTOMATION_ORIGIN: ${{ vars['JOBSCOPE_AUTOMATION_ORIGIN'] }}
      JOBSCOPE_AUTOMATION_TOKEN: ${{ secrets['JOBSCOPE_AUTOMATION_TOKEN'] }}
    steps:
      - name: Guard required configuration
        run: |
          set -euo pipefail
          [ -n "$JOBSCOPE_AUTOMATION_ORIGIN" ] || { echo "::error::JOBSCOPE_AUTOMATION_ORIGIN is not configured"; exit 1; }
          [ -n "$JOBSCOPE_AUTOMATION_TOKEN" ] || { echo "::error::JOBSCOPE_AUTOMATION_TOKEN is not configured"; exit 1; }
          case "$JOBSCOPE_AUTOMATION_ORIGIN" in https://*) ;; *) echo "::error::automation origin must use HTTPS"; exit 1;; esac

      - name: Run fixed hosted operation
        env:
          OPERATION: ${{ inputs.operation }}
          FORCE: ${{ inputs.force }}
          FULL_SCAN: ${{ inputs.full_scan }}
        run: |
          set -euo pipefail
          origin="${JOBSCOPE_AUTOMATION_ORIGIN%/}"
          response="$RUNNER_TEMP/hosted-response.json"
          status_file="$RUNNER_TEMP/hosted-status.json"

          api() {
            curl --silent --show-error --fail \
              --connect-timeout 10 --max-time 600 \
              --header "X-Jobscope-Automation: $JOBSCOPE_AUTOMATION_TOKEN" \
              --header "Origin: $origin" \
              "$@"
          }

          if [ "$OPERATION" = "tick" ]; then
            api --request POST --header "Content-Type: application/json" \
              --data '{}' "$origin/api/automation/tick" > "$response"
            python - "$response" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          tracking = value.get("tracking") or {}
          print(
              "outreach tick: "
              f"sent={bool(value.get('sent'))} code={value.get('code') or 'none'} "
              f"inbox={tracking.get('inbox_status') or 'unknown'} "
              f"replied={int(tracking.get('replied') or 0)} "
              f"opted_out={int(tracking.get('opted_out') or 0)}"
          )
          raise SystemExit(0 if value.get("ok") else 1)
          PY
            exit 0
          fi

          python - "$FORCE" "$FULL_SCAN" > "$RUNNER_TEMP/refresh-request.json" <<'PY'
          import json, sys
          truthy = {"1", "true", "yes"}
          print(json.dumps({
              "force": sys.argv[1].lower() in truthy,
              "full_scan": sys.argv[2].lower() in truthy,
          }))
          PY
          api --request POST --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/refresh-request.json" \
            "$origin/api/automation/refresh" > "$response"
          run_id="$(python - "$response" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          run_id = str(value.get("run_id") or "")
          if value.get("state") not in {"started", "busy"} or len(run_id) != 24:
              raise SystemExit("hosted refresh did not return a valid run id")
          print(run_id)
          PY
          )"

          for attempt in $(seq 1 300); do
            api "$origin/api/automation/status" > "$status_file"
            result="$(python - "$status_file" "$run_id" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          if str(value.get("run_id") or "") != sys.argv[2]:
              print("replaced")
          else:
              print(str(value.get("state") or "unknown"))
          PY
            )"
            case "$result" in
              done|skipped) echo "hosted refresh completed: $result"; exit 0;;
              error|replaced) echo "::error::hosted refresh ended: $result"; exit 1;;
            esac
            sleep 5
          done
          echo "::error::hosted refresh timed out"
          exit 1