[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobscope"
version = "0.1.0"
description = "Resume-driven job scout, enricher, and application-prep tool (deterministic-first, AI-optional)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "rinz0x0cruz" }]
keywords = ["jobs", "resume", "job-search", "ats", "automation", "career"]
dependencies = [
    "pyyaml==6.0.2",
    "requests==2.33.0",
    "pyjwt[crypto]==2.13.0",
    "feedparser==6.0.11",
    "yfinance==0.2.40",
    "pypdf==6.14.2",
    "markdown==3.8.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.12.4", "detect-secrets==1.5.0"]
# Optional Chromium renderer, used only by tailored-resume PDF export and the
# opt-in `apply --assist` autofill. Both already degrade without it: the tailor
# writes HTML instead of PDF, and assisted fill reports that it is unavailable.
# Needs `python -m playwright install chromium` as well as the wheel.
pdf = ["playwright==1.40.0"]
# Optional OS-keychain storage for secrets (Windows Credential Manager / macOS
# Keychain / Secret Service). The tool falls back to environment/.env without it.
secure = ["keyring>=24"]
# Optional multi-model AI backend (routes ai.chat through a quorum deliberation).
# Pinned to an immutable release; bump the tag to adopt a newer quorum.
quorum = ["quorum @ git+https://github.com/rinz0x0cruz/quorum.git@v0.3.0"]

[project.scripts]
jobscope = "jobscope.__main__:main"

[tool.setuptools.packages.find]
include = ["jobscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Conservative: real-error rules (pyflakes + select pycodestyle), not style churn.
select = ["E4", "E7", "E9", "F"]
